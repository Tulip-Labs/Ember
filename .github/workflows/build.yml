# Builds Ember for Linux (.tar.gz, .deb, .rpm) and Windows on every push,
# checks that niri accepts the settings Ember writes, then installs the Linux
# packages on several distributions (Fedora Silverblue's image among them)
# and starts Ember on a headless Wayland (Weston) to check it opens and
# answers --toggle.
# The release workflow calls this and publishes what it makes.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    # Ubuntu 24.04 (GTK 4.14, libadwaita 1.5): the oldest supported, so the
    # program runs on newer systems too. Swift's libraries are built in.
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4, libadwaita and packaging tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config dpkg-dev binutils curl ca-certificates >/dev/null
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build, test, and make the .tar.gz, .deb and .rpm
        run: ./build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            linux/build/*.tar.gz
            linux/build/*.deb
            linux/build/*.rpm

  niri-settings:
    # niri's own parser reads the files Ember writes, in both appearances
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: niri's config parser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libinput-dev libudev-dev libgtk-4-1 libadwaita-1-0 >/dev/null
          # the newest release tag, from git itself (GitHub's API limits anonymous calls)
          tag=$(git ls-remote --tags --refs https://github.com/YaLTeR/niri 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "no niri release tag found"; exit 1; }
          echo "niri $tag"
          git clone -q --depth 1 --branch "$tag" https://github.com/YaLTeR/niri /tmp/niri
          mkdir -p /tmp/niri/niri-config/examples
          cat > /tmp/niri/niri-config/examples/check.rs <<'RS'
          fn main() {
              let p = std::env::args().nth(1).unwrap();
              match niri_config::Config::load(std::path::Path::new(&p)).config {
                  Ok(_) => println!("niri accepts {p}"),
                  Err(e) => { eprintln!("{e:?}"); std::process::exit(1) }
              }
          }
          RS
          cd /tmp/niri && cargo build -q --release -p niri-config --example check
      - name: Ember's settings, light and dark, with and without blur
        run: |
          tar -xzf pkg/Ember-linux-x86_64.tar.gz -C /tmp
          ember=/tmp/Ember-linux-x86_64/ember
          export HOME=$(mktemp -d)
          mkdir -p $HOME/.config/niri
          printf 'input {}\nspawn-at-startup "waybar"\nspawn-at-startup "swaybg" "-i" "/x.png"\n' > $HOME/.config/niri/config.kdl
          $ember --setup-niri
          cat $HOME/.config/niri/config.kdl
          for look in --light --dark; do
            for blur in 0 1; do
              EMBER_NIRI_BLUR=$blur $ember $look
              EMBER_NIRI_BLUR=$blur $ember --niri-theme
              /tmp/niri/target/release/examples/check $HOME/.config/niri/config.kdl
            done
          done
          $ember --remove-niri
          cat $HOME/.config/niri/config.kdl

  windows:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Build Ember.exe with mingw-w64
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 zip
          ./build.sh
          zip -q Ember-3.1-windows.zip Ember.exe INSTALAR.bat RESTAURAR-EXPLORER.bat README.txt README-INSTALAR.txt CHANGES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/Ember-3.1-windows.zip

  install:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: "debian:13", kind: deb}
          - {distro: "ubuntu:24.04", kind: deb}
          - {distro: "ubuntu:26.04", kind: deb}
          - {distro: "fedora:42", kind: rpm}
          - {distro: "fedora:43", kind: rpm}
          # Fedora Silverblue's own image: GTK 4 and libadwaita come with it,
          # so the .rpm layers with nothing more (rpm-ostree install ember-shell)
          - {distro: "quay.io/fedora-ostree-desktops/silverblue:43", kind: silverblue}
          - {distro: "opensuse/tumbleweed", kind: zypper}
          - {distro: "archlinux:latest", kind: tar}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install
        run: |
          set -e
          case "${{ matrix.kind }}" in
          deb)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./pkg/*.deb weston procps >/dev/null
            ;;
          rpm)
            dnf install -y -q ./pkg/*.rpm weston procps-ng mesa-dri-drivers
            ;;
          silverblue)
            # what rpm-ostree would layer: the package must need nothing the image lacks
            rpm -i --test ./pkg/*.rpm
            rpm -i ./pkg/*.rpm
            dnf install -y -q weston procps-ng mesa-dri-drivers
            ;;
          zypper)
            zypper --non-interactive -q install --allow-unsigned-rpm ./pkg/*.rpm weston procps Mesa-dri
            ;;
          tar)
            pacman -Syu --noconfirm --needed gtk4 libadwaita mesa weston procps-ng tar gzip >/dev/null
            tar -xzf pkg/Ember-linux-x86_64.tar.gz -C /tmp
            useradd -m tester
            su tester -c "/tmp/Ember-linux-x86_64/install.sh"
            ln -s /home/tester/.local/bin/ember /usr/local/bin/ember
            ;;
          esac
          id -u tester >/dev/null 2>&1 || useradd -m tester
      - name: Libraries are all there
        run: |
          exe=$(readlink -f "$(command -v ember)")
          echo "$exe"; ember --version
          ! ldd "$exe" | grep "not found"
      - name: Ember opens on Wayland and answers --toggle
        run: |
          cat > /tmp/smoke.sh <<'SH'
          set -u
          export XDG_RUNTIME_DIR=$(mktemp -d) LIBGL_ALWAYS_SOFTWARE=1 GSK_RENDERER=cairo
          weston --backend=headless --renderer=gl --socket=wl-test --width=1280 --height=800 > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/wl-test" ]; then echo "Weston did not start here; skipped:"; tail -5 /tmp/weston.txt; exit 0; fi
          export WAYLAND_DISPLAY=wl-test
          ember > /tmp/ember.txt 2>&1 &
          pid=$!
          sleep 8
          kill -0 $pid || { cat /tmp/ember.txt; echo "Ember exited"; exit 1; }
          timeout 5 ember --toggle || { cat /tmp/ember.txt; echo "--toggle (hide) failed"; exit 1; }
          sleep 3
          if kill -0 $pid 2>/dev/null; then cat /tmp/ember.txt; echo "Ember is still running after hiding"; exit 1; fi
          ember --toggle > /tmp/ember2.txt 2>&1 &
          pid=$!
          sleep 6
          kill -0 $pid || { cat /tmp/ember2.txt; echo "Ember did not come back"; exit 1; }
          grep -E "VmRSS|RssAnon|RssFile|RssShmem" /proc/$pid/status
          ls ~/.local/share/ember/wallpapers
          cat /tmp/ember.txt /tmp/ember2.txt
          kill $pid
          echo "Ember opened, hid (and quit), and came back."
          SH
          chmod 755 /tmp/smoke.sh
          su tester -c "sh /tmp/smoke.sh"
