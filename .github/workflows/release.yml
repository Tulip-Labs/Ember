# Publishes a release: Actions > Release > Run workflow, with a tag like
# v2.0.0 (it must match the version in linux/Sources/Ember/Main.swift). Attaches the
# Linux .tar.gz, .deb, .rpm and the Windows zip, one SHA256SUMS (Ember's
# updater checks downloads against it) and the AUR recipe, and updates the
# apt and dnf repositories on GitHub Pages (gh-pages branch).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, for example v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Release with every file
        run: |
          rm -f art/*.png # the theme screenshots are for checking, not for the release
          ls -l art
          ver=${TAG#v}
          want=$(sed -n 's/.*static let version = "\(.*\)"/\1/p' linux/Sources/Ember/Main.swift)
          [ "$ver" = "$want" ] || { echo "the tag $TAG does not match the version $want"; exit 1; }
          sha256sum art/* | sed 's#  art/#  #' > SHA256SUMS
          sum=$(sha256sum art/Ember-linux-x86_64.tar.gz | cut -d' ' -f1)
          sed -e "s/@VERSION@/$ver/" -e "s/@SHA256@/$sum/" packaging/PKGBUILD.in > PKGBUILD
          cat SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" art/* SHA256SUMS PKGBUILD --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ember $TAG" --notes-file packaging/release-notes.md art/* SHA256SUMS PKGBUILD
          fi
      - name: apt and dnf repositories
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c gnupg rpm
          ./packaging/update-repo.sh art site
      - name: Publish the repositories
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ember $TAG packages"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
